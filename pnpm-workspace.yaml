packages:
  - apps/*
  - packages/*
allowBuilds:
  bcrypt: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@eleansphere/*'
  - '@types/node@22.20.3'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
# Patched versions of Express's own dependencies (security advisories), until Express 4 pins them.
# The same as in Eleansphere/core: a library's overrides don't reach the apps that install it.
overrides:
  body-parser@1: ^1.20.9
  moment: ^2.31.0
  proxy-addr: ^2.0.8
  qs: ^6.16.1
