# Local services for development and tests:
#   docker compose up -d
# Postgres:  postgres://kniho:kniho@localhost:5434/kniho
# Mailpit:   SMTP on localhost:1025, inbox at http://localhost:8025
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kniho
      POSTGRES_PASSWORD: kniho
      POSTGRES_DB: kniho
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kniho']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'
